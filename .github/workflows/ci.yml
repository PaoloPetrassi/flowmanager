name: FlowManager CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flowmanager-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, lint and frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, intl, openssl, pdo_sqlite, sqlite3, simplexml, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Show runtime versions
        run: |
          php --version
          composer --version

      - name: Validate Composer configuration
        run: composer validate --strict --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare Laravel runtime directories
        run: |
          mkdir -p storage/app
          mkdir -p storage/logs
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p bootstrap/cache

          chmod -R 775 storage
          chmod -R 775 bootstrap/cache

      - name: Configure CI environment
        shell: bash
        run: |
          cp .env.example .env

          touch database/database.sqlite

          echo "APP_ENV=testing" >> .env
          echo "APP_DEBUG=true" >> .env
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=$(pwd)/database/database.sqlite" >> .env
          echo "CACHE_STORE=array" >> .env
          echo "SESSION_DRIVER=array" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env

          php artisan key:generate
          php artisan optimize:clear

      - name: Validate migrations
        run: php artisan migrate:fresh --force

      - name: FlowManager doctor
        run: php artisan flowmanager:doctor --ci

      - name: PHP syntax
        run: composer lint

      - name: Code style
        run: php vendor/bin/pint --test

      - name: Feature tests
        run: php artisan test

      - name: Frontend build
        run: npm run build

      - name: Release readiness
        run: php artisan flowmanager:release-check --ci --build

      - name: Route integrity
        run: php artisan route:list --except-vendor