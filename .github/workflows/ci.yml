name: FlowManager CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flowmanager-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, lint and frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, openssl, pdo_sqlite, sqlite3, simplexml, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate --strict --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure CI environment
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=$(pwd)/database/database.sqlite" >> .env
          sed -i 's/^CACHE_STORE=.*/CACHE_STORE=array/' .env
          sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=array/' .env
          sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env
          php artisan optimize:clear

      - name: Validate migrations
        run: php artisan migrate:fresh --force

      - name: FlowManager doctor
        run: php artisan flowmanager:doctor --ci

      - name: PHP syntax
        run: composer lint

      - name: Code style
        run: php vendor/bin/pint --test

      - name: Feature tests
        run: php artisan test

      - name: Frontend build
        run: npm run build

      - name: Release readiness
        run: php artisan flowmanager:release-check --ci --build

      - name: Route integrity
        run: php artisan route:list --except-vendor
